<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat con Inteligencia Artificial</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans h-screen flex flex-col justify-between">

    <!-- Encabezado -->
    <header class="bg-gray-800 p-4 shadow-md text-center border-b border-gray-700">
        <h1 class="text-xl font-bold text-teal-400">🤖 Mi Asistente IA</h1>
        <p class="text-xs text-gray-400">Conectado a la API de Gemini 2.5</p>
    </header>

    <!-- Área de Mensajes del Chat -->
    <main id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-3xl w-full mx-auto">
        <div class="flex justify-start">
            <div class="bg-gray-800 p-3 rounded-lg rounded-tl-none max-w-xs md:max-w-md shadow">
                <p class="text-sm">¡Hola! Soy tu IA funcional conectado a Gemini. ¿En qué puedo ayudarte hoy?</p>
            </div>
        </div>
    </main>

    <!-- Indicador de Carga -->
    <div id="loading" class="hidden text-center text-xs text-gray-400 animate-pulse pb-2">
        Gemini está pensando... 🤔
    </div>

    <!-- Formulario de Entrada de Texto -->
    <footer class="bg-gray-800 p-4 border-t border-gray-700">
        <form id="chat-form" class="max-w-3xl mx-auto flex gap-2">
            <input 
                type="text" 
                id="user-input" 
                placeholder="Escribe tu mensaje aquí..." 
                class="flex-1 bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-teal-400 text-white"
                required
                autocomplete="off"
            >
            <button 
                type="submit" 
                class="bg-teal-500 hover:bg-teal-600 text-gray-900 font-semibold px-5 py-2 rounded-lg text-sm transition shadow"
            >
                Enviar
            </button>
        </form>
    </footer>

    <script>
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const chatBox = document.getElementById('chat-box');
        const loading = document.getElementById('loading');

        // DIRECCIÓN DE TU CODESPACE (Se lee automáticamente del navegador)
        const currentHost = window.location.host;
        const apiHost = currentHost.replace('-8000.', '-8000.').replace('fictional-computing-machine-jrqrp95grxj7cqjj', 'fictional-computing-machine-jrqrp95grxj7cqjj'); 
        
        // Esta línea une tu backend de la nube automáticamente sin que tengas que copiar y pegar URLs largas
        const API_URL = `https://${window.location.hostname.replace('-8000', '')}-8000.app.github.dev/preguntar`;

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const mensajeTexto = userInput.value.trim();
            if (!mensajeTexto) return;

            agregarMensaje(mensajeTexto, 'usuario');
            userInput.value = '';

            loading.classList.remove('hidden');
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ texto: mensajeTexto })
                });

                if (!response.ok) throw new Error('Error en el servidor');

                const data = await response.json();
                agregarMensaje(data.respuesta_ia, 'ia');

            } catch (error) {
                console.error(error);
                agregarMensaje('⚠️ Error: No se pudo conectar con el servidor backend en app.py.', 'sistema');
            } finally {
                loading.classList.add('hidden');
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        });

        function agregarMensaje(texto, remitente) {
            const divContenedor = document.createElement('div');
            const divMensaje = document.createElement('div');
            divContenedor.classList.add('flex');
            divMensaje.classList.add('p-3', 'rounded-lg', 'max-w-xs', 'md:max-w-md', 'shadow', 'text-sm');

            if (remitente === 'usuario') {
                divContenedor.classList.add('justify-end');
                divMensaje.classList.add('bg-teal-600', 'text-white', 'rounded-tr-none');
            } else if (remitente === 'ia') {
                divContenedor.classList.add('justify-start');
                divMensaje.classList.add('bg-gray-800', 'text-gray-100', 'rounded-tl-none');
            } else {
                divContenedor.classList.add('justify-center');
                divMensaje.classList.add('bg-red-900', 'text-red-200');
            }

            divMensaje.innerText = texto;
            divContenedor.appendChild(divMensaje);
            chatBox.appendChild(divContenedor);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
